<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(
                    circle at center,
                    #ff8fbd 0%,
                    #d92f73 35%,
                    #5c0d31 70%,
                    #210011 100%
                );

            overflow: hidden;
        }


        /* =========================
           EKRAN HASŁA
        ========================= */

        #login {
            text-align: center;

            padding: 45px 50px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.35),
                0 0 50px rgba(255, 120, 180, 0.25);
        }


        #login h1 {
            margin: 0 0 10px;

            color: white;

            font-size: 30px;

            text-shadow:
                0 2px 10px rgba(0,0,0,0.25);
        }


        #login p {
            margin: 0 0 25px;

            color: #ffe5f0;

            font-size: 15px;
        }


        #password {
            width: 280px;

            padding: 15px 20px;

            border: none;
            outline: none;

            border-radius: 30px;

            background: rgba(255,255,255,0.95);

            text-align: center;

            font-size: 17px;
        }


        #login button {
            display: block;

            margin: 15px auto 0;

            padding: 13px 35px;

            border: none;

            border-radius: 30px;

            background: #ffffff;

            color: #c51e62;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        #login button:hover {
            transform: scale(1.06);

            box-shadow:
                0 0 25px rgba(255,255,255,0.7);
        }


        #error {
            display: none;

            margin-top: 15px;

            color: #ffe1eb;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }


        /* =========================
           GŁÓWNA STRONA
        ========================= */

        #content {
            display: none;

            text-align: center;

            animation: appear 1.2s ease;
        }


        @keyframes appear {

            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =========================
           SERCE
        ========================= */

        .heart-wrapper {
            position: relative;

            width: 430px;
            height: 390px;

            margin: auto;

            animation: heartbeat 2s infinite ease-in-out;
        }


        .heart {
            position: absolute;

            width: 300px;
            height: 300px;

            left: 65px;
            top: 45px;

            background: linear-gradient(
                135deg,
                #fff5f8,
                #ffd6e5
            );

            transform: rotate(-45deg);

            border-radius: 30px;

            box-shadow:
                0 0 25px rgba(255, 255, 255, 0.9),
                0 0 60px rgba(255, 190, 215, 0.8),
                0 10px 30px rgba(60, 0, 30, 0.25);
        }


        .heart::before,
        .heart::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            background: inherit;

            border-radius: 50%;
        }


        .heart::before {
            top: -150px;
            left: 0;
        }


        .heart::after {
            top: 0;
            left: 150px;
        }


        /* =========================
           ZDJĘCIA
        ========================= */

        .photos {
            position: absolute;

            z-index: 10;

            left: 50%;
            top: 125px;

            transform: translateX(-50%);

            display: flex;

            align-items: center;
        }


        .photos img {
            width: 135px;
            height: 135px;

            object-fit: cover;

            border-radius: 50%;

            border: 6px solid white;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.35);

            background: #eee;

            transition: 0.3s;
        }


        .photos img:first-child {
            margin-right: -25px;

            transform: rotate(-5deg);
        }


        .photos img:last-child {
            transform: rotate(5deg);
        }


        .photos img:hover {
            transform: scale(1.08) rotate(0deg);

            z-index: 20;
        }


        /* =========================
           TEKST
        ========================= */

        .title {
            margin-top: -5px;

            color: white;

            font-size: 34px;

            font-weight: bold;

            text-shadow:
                0 3px 15px rgba(80,0,30,0.5);
        }


        .subtitle {
            margin-top: 8px;

            color: #ffe5ef;

            font-family: Arial, sans-serif;

            font-size: 19px;

            font-style: italic;
        }


        /* =========================
           ANIMACJA SERCA
        ========================= */

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.025);
            }

        }


        /* =========================
           LATAJĄCE SERDUSZKA
        ========================= */

        .floating-heart {
            position: fixed;

            bottom: -50px;

            z-index: 1;

            font-size: 22px;

            opacity: 0;

            animation: floatUp 8s linear infinite;
        }


        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            85% {
                opacity: 0.7;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         LATAJĄCE SERDUSZKA
    ========================= -->

    <div class="floating-heart"
         style="left: 8%; animation-delay: 0s;">
        ❤️
    </div>

    <div class="floating-heart"
         style="left: 20%; animation-delay: 3s;">
        💗
    </div>

    <div class="floating-heart"
         style="left: 35%; animation-delay: 6s;">
        🤍
    </div>

    <div class="floating-heart"
         style="left: 55%; animation-delay: 2s;">
        ❤️
    </div>

    <div class="floating-heart"
         style="left: 72%; animation-delay: 5s;">
        💕
    </div>

    <div class="floating-heart"
         style="left: 88%; animation-delay: 1s;">
        💗
    </div>


    <div class="container">


        <!-- =========================
             HASŁO
        ========================= -->

        <div id="login">

            <h1>
                💍 Tylko dla wybranej osoby
            </h1>

            <p>
                Wpisz hasło, aby kontynuować...
            </p>


            <input
                type="password"
                id="password"
                placeholder="Hasło"
            >


            <button onclick="checkPassword()">
                WEJDŹ ❤️
            </button>


            <div id="error">
                Nieprawidłowe hasło 💔
            </div>

        </div>


        <!-- =========================
             PRANK
        ========================= -->

        <div id="content">


            <div class="heart-wrapper">


                <!-- SERCE -->

                <div class="heart"></div>


                <!-- ZDJĘCIA -->

                <div class="photos">

                    <img
                        src="ty.jpg"
                        alt="Ty"
                    >

                    <img
                        src="kuzyn.jpg"
                        alt="Kuzyn"
                    >

                </div>


            </div>


            <!-- TEKST -->

            <div class="title">
                mój ukochany kuzyn
            </div>


            <div class="subtitle">
                (widzimy się w środę)
            </div>


        </div>

    </div>


    <!-- =========================
         MUZYKA
    ========================= -->

    <audio id="music" loop>

        <source
            src="muzyka.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script>


        function checkPassword() {

            const password =
                document.getElementById("password").value;


            /* =========================
               TWOJE HASŁA
            ========================= */

            const correctPasswords = [
                "dawidgwiazda",
                "razdwahahaha"
            ];


            if (correctPasswords.includes(password)) {

                document.getElementById("login").style.display =
                    "none";

                document.getElementById("content").style.display =
                    "block";

                const music =
                    document.getElementById("music");

                music.play();

            } else {

                document.getElementById("error").style.display =
                    "block";

            }

        }


        /* ENTER = ZATWIERDŹ HASŁO */

        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    checkPassword();

                }

            });


    </script>


</body>
</html>
